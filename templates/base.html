<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Cognito + Django</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f4f6fb; margin:0; color:#1f2937; }
    main { max-width: 720px; margin: 8vh auto; background:#fff; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    .btn { display:inline-block; background:#4f46e5; color:#fff; border:0; padding:.75rem 1.4rem; border-radius:10px; font-size:1rem; text-decoration:none; cursor:pointer; }
    .btn:hover { background:#4338ca; }
    .error { background:#fee2e2; color:#991b1b; padding:.75rem 1rem; border-radius:8px; margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; margin:1rem 0 1.5rem; }
    td, th { text-align:left; padding:.45rem .6rem; border-bottom:1px solid #e5e7eb; word-break:break-all; }
    th { width:35%; color:#6b7280; font-weight:600; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
